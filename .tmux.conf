# ============================================================
# TMUX CONFIGURATION — READABLE, CONSTRAINED MULTIPLEXING
# ============================================================
#
# Philosophy:
#   - Use tmux windows as tabs/workspaces.
#   - Keep the number of panes limited so terminal content
#     remains readable.
#   - Prefer opening another window over endlessly splitting
#     the current screen.
#
# Why limit panes?
#   Every split reduces the space available to each terminal.
#   Too many side-by-side panes make commands, logs, diffs,
#   and source code difficult to read.
#
#   Horizontal stacking (panes arranged top/bottom) preserves
#   terminal width, so it can support more panes when needed.
#   Vertical splitting (panes arranged left/right) reduces
#   terminal width and should be restricted more aggressively.
#
#   Default policy:
#     - Side-by-side: at most 2 panes.
#     - Top/bottom:   at most 2 panes by default.
#     - Optional extension: allow up to 4 stacked panes,
#       provided each pane remains tall enough to be useful.
#
# Note:
#   This configuration customizes the default tmux key
#   bindings. It is not a change to tmux's underlying pane
#   model. Other commands, plugins, and scripts can still
#   create additional panes unless they follow these rules.
# ============================================================


# ------------------------------------------------------------
# 1. PREFIX KEY
# ------------------------------------------------------------
#
# The prefix is the key you press before a tmux shortcut.
# Use Ctrl-Space instead of the default Ctrl-B.
#
# Example:
#   Ctrl-Space, then c  -> create a new window (tab).
#
# Choose a prefix that does not conflict with your terminal,
# shell, or operating-system shortcuts.

set -g prefix C-Space
unbind C-b
bind C-Space send-prefix


# ------------------------------------------------------------
# 2. WINDOWS = TABS / WORKSPACES
# ------------------------------------------------------------
#
# Windows let you create separate workspaces without shrinking
# your current terminal.
#
# Prefer a new window when you need another full-size terminal.
# A new window does not reduce the space available to existing
# panes in other windows.
#
# Ctrl-Space, c  -> new window
# Ctrl-Space, n  -> next window
# Ctrl-Space, p  -> previous window
#
# Numbered windows can also be selected directly with the
# default tmux window-selection shortcuts.

bind c new-window
bind n next-window
bind p previous-window


# ------------------------------------------------------------
# 3. CONTROLLED SPLITS — NEVER NARROW THE SCREEN TOO FAR
# ------------------------------------------------------------
#
# The following bindings allow a split only when the current
# window has exactly one pane.
#
# This enforces a simple rule:
#   One pane -> splitting is allowed.
#   Two panes -> splitting is refused.
#
# The intention is to prevent accidental creation of a third
# pane, which often makes terminal output hard to read.
#
# "|" creates a LEFT/RIGHT layout:
#
#   +-------------+-------------+
#   |             |             |
#   |    Pane 1   |    Pane 2   |
#   |             |             |
#   +-------------+-------------+
#
# "-" creates a TOP/BOTTOM layout:
#
#   +---------------------------+
#   |          Pane 1           |
#   +---------------------------+
#   |          Pane 2           |
#   +---------------------------+
#
# These are default bindings for a conservative two-pane
# workflow. The pane limit applies independently to each
# window, so you can have many tabs, each with up to two panes.

bind | if-shell -F '#{==:#{window_panes},1}' \
  'split-window -h' \
  'display-message "Pane limit reached: use a new window instead"'

bind - if-shell -F '#{==:#{window_panes},1}' \
  'split-window -v' \
  'display-message "Pane limit reached: use a new window instead"'


# ------------------------------------------------------------
# 4. OPTIONAL: ALLOW UP TO FOUR TOP/BOTTOM PANES
# ------------------------------------------------------------
#
# Use this alternative only if you sometimes need several
# narrow, stacked terminals, such as short monitoring views.
#
# A TOP/BOTTOM split preserves the full terminal width, unlike
# repeated LEFT/RIGHT splits. However, every split reduces
# available height, so four panes should only be used when
# the terminal is tall enough and the output is compact.
#
# Example:
#
#   +---------------------------+
#   |          Pane 1           |
#   +---------------------------+
#   |          Pane 2           |
#   +---------------------------+
#   |          Pane 3           |
#   +---------------------------+
#   |          Pane 4           |
#   +---------------------------+
#
# To enable this exception, replace the default "-" binding
# above with the following. It allows up to four panes in the
# current window, while "|" remains limited to two panes.
#
# NOTE:
#   This is a simple pane-count check. It does not prove that
#   every pane is tall enough to read. You may want to impose
#   a minimum terminal height as an additional condition.
#
# bind - if-shell -F '#{<:#{window_panes},4}' \
#   'split-window -v' \
#   'display-message "Maximum four stacked panes per window"'


# ------------------------------------------------------------
# 5. VIM-STYLE PANE NAVIGATION
# ------------------------------------------------------------
#
# Move between existing panes using familiar Vim directions:
#
#   h = left
#   j = down
#   k = up
#   l = right
#
# Navigation does not create additional panes; it only changes
# which pane receives keyboard input.
#
# These bindings are convenient when working with a shell next
# to a server, editor, or diff.

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ------------------------------------------------------------
# 6. CLOSE THE CURRENT PANE
# ------------------------------------------------------------
#
# Ctrl-Space, x -> close the active pane.
#
# If only one pane remains, closing it normally closes the
# current window when its shell exits. Use a new window for
# another full-size workspace instead of splitting repeatedly.

bind x kill-pane


# ------------------------------------------------------------
# 7. GENERAL RULE
# ------------------------------------------------------------
#
# When a pane becomes too small to read comfortably:
#
#   1. Close an unnecessary pane.
#   2. Open another window if you need another full-size view.
#   3. Prefer top/bottom splits for short monitoring output.
#   4. Avoid repeatedly splitting left/right.
#
# The objective is not to maximize the number of terminals.
# It is to keep every visible terminal useful and readable.
# ============================================================
